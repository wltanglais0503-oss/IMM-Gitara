<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isika Miaraka Mianatra</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(21, 31, 50, 0.7);
            --border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --accent: #ff7a00;
            --accent-rgb: 255, 122, 0;
            --mvola: #ffc000;
            --orange: #ff6600;
        }
        
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(at 50% 0%, rgba(var(--accent-rgb), 0.15) 0px, transparent 60%);
            color: var(--text-main); padding-bottom: 2rem;
        }

        /* BARRE DE DIAGNOSTIC - Te montre si le site fonctionne vraiment */
        .status-bar {
            background: linear-gradient(90deg, #3b82f6, #10b981);
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .wrapper { max-width: 480px; margin: 0 auto; padding: 1rem; }
        .brand-nav { text-align: center; margin-bottom: 1rem; }
        .brand-logo { font-size: 18px; font-weight: 800; border: 1px solid var(--border); padding: 6px 18px; border-radius: 30px; display: inline-block; background: rgba(255,255,255,0.02); }
        .glass-card { background: var(--card-bg); border: 1px solid rgba(var(--accent-rgb), 0.15); border-radius: 24px; padding: 1.5rem; backdrop-filter: blur(12px); }

        .course-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        .course-card { 
            border: 1px solid rgba(255,255,255,0.08); 
            background: rgba(9, 13, 22, 0.5); 
            padding: 16px; 
            border-radius: 16px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .course-card:active { transform: scale(0.97); }
        .course-card.selected { background: rgba(var(--accent-rgb), 0.08); border-color: var(--accent); box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.2); }
        
        .details-box { background: rgba(9, 13, 22, 0.4); border: 1px dashed rgba(var(--accent-rgb), 0.25); padding: 14px; border-radius: 12px; margin-bottom: 16px; font-size: 13px; }
        
        .operator-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .operator-card { background: rgba(9, 13, 22, 0.4); border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; border: 2px solid transparent; -webkit-tap-highlight-color: transparent; }
        .operator-card.selected[data-op="mvola"] { border-color: var(--mvola); }
        .operator-card.selected[data-op="orange"] { border-color: var(--orange); }

        .input-control { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: rgba(9, 13, 22, 0.6); color: white; margin-bottom: 16px; outline: none; }
        .instructions-box { background: #030712; border: 1px solid #1f2937; padding: 14px; border-radius: 14px; margin-bottom: 16px; }
        .ussd-code { background: #0b1322; padding: 12px; border-radius: 10px; color: #38bdf8; font-family: monospace; font-size: 16px; text-align: center; display: block; font-weight: 700; margin-top: 5px; }
        .btn-pay { width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div class="status-bar" id="js-status">🔴 CHARGEMENT DU SYSTEME...</div>

<div class="wrapper">
    <div class="brand-nav">
        <div class="brand-logo">ISIKA MIARAKA MIANATRA</div>
    </div>

    <div class="glass-card">
        <label style="font-size: 11px; color: #94a3b8; text-transform: uppercase;">1. Fidio ny fampianarana</label>
        <div class="course-grid">
            <div class="course-card selected" data-value="30000" data-type="guitar" id="c1">
                <div>🚀 Programme Autonome</div>
                <div style="font-weight:800; color:var(--accent);">30 000 Ar</div>
            </div>
            <div class="course-card" data-value="75000" data-type="suivi" id="c2">
                <div>🔥 Programme Avec Suivi</div>
                <div style="font-weight:800;">75 000 Ar</div>
            </div>
        </div>

        <div class="details-box" id="product-details">Chargement des détails...</div>

        <label style="font-size: 11px; color: #94a3b8; text-transform: uppercase;">2. Ny Anaranao</label>
        <input type="text" id="client-name" class="input-control" placeholder="Anarana">

        <label style="font-size: 11px; color: #94a3b8; text-transform: uppercase;">3. Réseau</label>
        <div class="operator-grid">
            <div class="operator-card selected" data-op="mvola" id="op1">🟡 Mvola</div>
            <div class="operator-card" data-op="orange" id="op2">🍊 Orange</div>
        </div>

        <div class="instructions-box">
            <span style="font-size:12px; color:#64748b;">Code USSD hivoaka :</span>
            <span class="ussd-code" id="current-ussd">...</span>
        </div>

        <button class="btn-pay" id="btn-pay">Lancer le transfert</button>
    </div>
</div>

<script>
    var selectedOp = "mvola";
    var currentPrice = "30000";
    var numMerchant = { "mvola": "0340642052", "orange": "0379596880" };

    function updateSite() {
        var code = selectedOp === "mvola" ? "#111*1*2*1*" + numMerchant[selectedOp] + "*" + currentPrice + "#" : "*150*1*1*" + numMerchant[selectedOp] + "*" + currentPrice + "#";
        document.getElementById('current-ussd').innerText = code;
    }

    function selectCourse(card, price, type) {
        document.querySelectorAll('.course-card').forEach(c => {
            c.classList.remove('selected');
            c.querySelector('div:nth-child(2)').style.color = 'white';
        });
        card.classList.add('selected');
        card.querySelector('div:nth-child(2)').style.color = 'var(--accent)';
        currentPrice = price;
        
        document.getElementById('product-details').innerHTML = type === 'guitar' ? '📦 Pack Vidéo complet autonome sans suivi.' : '🎓 Formation complète avec suivi personnalisé sur WhatsApp.';
        updateSite();
    }

    function selectOp(card, op) {
        document.querySelectorAll('.operator-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedOp = op;
        updateSite();
    }

    // Clics directs et simplifiés
    document.getElementById('c1').onclick = function() { selectCourse(this, '30000', 'guitar'); };
    document.getElementById('c2').onclick = function() { selectCourse(this, '75000', 'suivi'); };
    document.getElementById('op1').onclick = function() { selectOp(this, 'mvola'); };
    document.getElementById('op2').onclick = function() { selectOp(this, 'orange'); };

    // Au chargement complet, si le JS tourne, la barre devient VERTE
    window.onload = function() {
        document.getElementById('js-status').innerHTML = "🟢 SITE EN LIGNE ET 100% INTERACTIF";
        document.getElementById('js-status').style.background = "linear-gradient(90deg, #10b981, #059669)";
        selectCourse(document.getElementById('c1'), '30000', 'guitar');
    };
</script>
</body>
</html>
